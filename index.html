<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎴 화투 운세 — 오늘의 점괘</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-dark:    #0e0a1a;
      --bg-card:    #1a1230;
      --gold:       #d4a843;
      --gold-light: #f0c96a;
      --purple:     #7b5ea7;
      --purple-dark:#4a3570;
      --text:       #e8dfc8;
      --text-dim:   #9a8f78;
      --glow:       rgba(212,168,67,0.35);
    }
    body {
      min-height: 100vh;
      background: var(--bg-dark);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(123,94,167,0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(212,168,67,0.10) 0%, transparent 60%);
      font-family: 'Noto Serif KR', 'Malgun Gothic', serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }
    header { text-align: center; margin-bottom: 32px; }
    header .title-icon { font-size: 2.6rem; display: block; margin-bottom: 8px; }
    header h1 { font-size: 2rem; font-weight: 700; color: var(--gold); text-shadow: 0 0 20px var(--glow); letter-spacing: 0.06em; }
    header .subtitle { margin-top: 6px; font-size: 0.9rem; color: var(--text-dim); letter-spacing: 0.08em; }
    .date-badge { display: inline-block; margin-top: 14px; padding: 4px 18px; border: 1px solid var(--purple); border-radius: 20px; font-size: 0.82rem; color: var(--purple); letter-spacing: 0.05em; }
    .divider { width: 220px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 22px auto; opacity: 0.45; }
    .instruction { text-align: center; font-size: 0.92rem; color: var(--text-dim); max-width: 380px; line-height: 1.75; margin-bottom: 28px; }
    .instruction strong { color: var(--gold-light); }
    #card-area { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
    .card-slot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .card-label { font-size: 0.75rem; color: var(--purple); letter-spacing: 0.1em; }
    .card-wrap { width: 110px; height: 160px; perspective: 900px; cursor: pointer; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(0.4,0,0.2,1); }
    .card-wrap.flipped .card-inner { transform: rotateY(180deg); }
    .card-face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
    .card-back { background: linear-gradient(145deg, #1f1440 0%, #2a1a55 100%); border: 2px solid var(--purple-dark); box-shadow: 0 4px 24px rgba(0,0,0,0.6), inset 0 0 30px rgba(123,94,167,0.12); }
    .card-back::before { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(212,168,67,0.25); border-radius: 7px; }
    .card-back-icon { font-size: 2.8rem; opacity: 0.7; }
    .card-back-text { font-size: 0.65rem; color: rgba(212,168,67,0.45); letter-spacing: 0.2em; margin-top: 6px; }
    .card-front { transform: rotateY(180deg); border: 2px solid; box-shadow: 0 6px 28px rgba(0,0,0,0.5); padding: 8px; text-align: center; flex-direction: column; gap: 4px; }
    .card-front .c-month { font-size: 0.65rem; letter-spacing: 0.1em; font-weight: 600; }
    .card-front .c-emoji { font-size: 2.8rem; line-height: 1; }
    .card-front .c-symbol { font-size: 1.4rem; }
    .card-front .c-name { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; }
    .card-front .c-type { font-size: 0.62rem; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,0.3); letter-spacing: 0.08em; }
    .type-광 .card-front { border-color: var(--gold); background: linear-gradient(145deg,#1e1500,#2c1e00); color: var(--gold-light); }
    .type-광 .card-front .c-type { color: var(--gold); border: 1px solid var(--gold); }
    .type-띠 .card-front { border-color: #c0392b; background: linear-gradient(145deg,#1e0500,#300a00); color: #f0a090; }
    .type-띠 .card-front .c-type { color: #e05040; border: 1px solid #c0392b; }
    .type-피 .card-front { border-color: #3a6a3a; background: linear-gradient(145deg,#0d1a0d,#142014); color: #a0d0a0; }
    .type-피 .card-front .c-type { color: #6aaf6a; border: 1px solid #3a6a3a; }
    .card-wrap:not(.flipped):hover .card-inner { transform: rotateY(10deg) translateY(-4px); }
    .card-wrap:not(.flipped):hover .card-back { box-shadow: 0 8px 32px rgba(123,94,167,0.5), inset 0 0 30px rgba(123,94,167,0.2); }
    .btn { padding: 12px 32px; border-radius: 8px; border: none; font-family: inherit; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.06em; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--purple-dark), var(--purple)); color: var(--gold-light); box-shadow: 0 4px 18px rgba(123,94,167,0.4); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(123,94,167,0.55); }
    .btn-gold { background: linear-gradient(135deg, #a07828, var(--gold)); color: #1a1000; box-shadow: 0 4px 18px rgba(212,168,67,0.3); }
    .btn-gold:hover { transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 1px solid var(--purple); color: var(--purple); }
    .btn-outline:hover { background: rgba(123,94,167,0.15); }
    #btn-area { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
    #result-panel { display: none; max-width: 680px; width: 100%; animation: fadeUp 0.6s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .result-header { text-align: center; margin-bottom: 24px; }
    .result-header h2 { font-size: 1.4rem; color: var(--gold); text-shadow: 0 0 16px var(--glow); }
    .result-header p { font-size: 0.85rem; color: var(--text-dim); margin-top: 6px; }
    .card-summaries { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
    .card-summary { flex: 1 1 160px; background: var(--bg-card); border-radius: 10px; padding: 14px; border-left: 3px solid var(--gold); min-width: 140px; }
    .card-summary .cs-role { font-size: 0.68rem; color: var(--purple); letter-spacing: 0.1em; margin-bottom: 4px; }
    .card-summary .cs-name { font-size: 0.95rem; font-weight: 600; color: var(--gold-light); }
    .card-summary .cs-sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
    .fortune-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    @media (max-width: 480px) { .fortune-grid { grid-template-columns: 1fr; } }
    .fortune-block { background: var(--bg-card); border-radius: 12px; padding: 18px; border: 1px solid rgba(212,168,67,0.12); transition: border-color 0.2s; }
    .fortune-block:hover { border-color: rgba(212,168,67,0.3); }
    .fortune-block .fb-icon { font-size: 1.4rem; margin-bottom: 8px; display: block; }
    .fortune-block .fb-title { font-size: 0.78rem; font-weight: 600; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 8px; }
    .fortune-block .fb-text { font-size: 0.87rem; line-height: 1.8; color: var(--text); }
    .fortune-block.full { grid-column: 1 / -1; }
    .stars { color: var(--gold); font-size: 1rem; margin-bottom: 6px; }
    .advice-box { background: linear-gradient(135deg, rgba(74,53,112,0.5), rgba(30,20,60,0.5)); border: 1px solid var(--purple-dark); border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; text-align: center; }
    .advice-box .ab-title { font-size: 0.78rem; color: var(--purple); letter-spacing: 0.15em; margin-bottom: 10px; }
    .advice-box .ab-text { font-size: 1rem; line-height: 1.9; color: var(--text); font-style: italic; }
    .advice-box .ab-text::before, .advice-box .ab-text::after { content: '"'; color: var(--gold); font-size: 1.3rem; font-style: normal; }
    .lucky-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 28px; }
    .lucky-item { background: rgba(212,168,67,0.08); border: 1px solid rgba(212,168,67,0.25); border-radius: 8px; padding: 8px 16px; font-size: 0.8rem; color: var(--gold-light); text-align: center; }
    .lucky-item .li-label { font-size: 0.65rem; color: var(--text-dim); display: block; margin-bottom: 2px; letter-spacing: 0.1em; }
    .action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(212,168,67,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { margin-top: 48px; font-size: 0.72rem; color: rgba(154,143,120,0.5); text-align: center; letter-spacing: 0.06em; }
  </style>
</head>
<body>
<header>
  <span class="title-icon">🎴</span>
  <h1>화투 운세</h1>
  <p class="subtitle">전통 화투로 보는 오늘의 점괘</p>

</header>
<div class="divider"></div>

  마음을 가다듬고 눈을 잠시 감으세요.<br>

  세 장의 패를 하나씩 천천히 뒤집어보세요.
</p>
<div id="card-area">

    <span class="card-label">현재 · 상황</span>

    </div>
  </div>
  <div class="card-slot">
    <span class="card-label">조언 · 주의</span>
    <div class="card-wrap" id="card-1" onclick="flipCard(1)" style="pointer-events:none">
      <div class="card-inner">
        <div class="card-face card-back"><span class="card-back-icon">🎴</span><span class="card-back-text">화 · 투</span></div>

      </div>
    </div>

  <div class="card-slot">

      </div>
    </div>

</div>
<div id="btn-area">

<div id="result-panel"></div>
<footer>✦ 전통 화투점 ✦ 오락 목적으로 제작되었습니다 ✦</footer>
<script>

  const months = [
    {num:1, name:'솔', full:'소나무', emoji:'🌲', symbol:'🦅'},

    {num:12, name:'오동', full:'오동나무', emoji:'🦜', symbol:'✨'},
  ];
  const configs = [

  months.forEach((m, mi) => {

    '피':{overall:'잔잔한 일상이 계속됩니다. 현재의 소중함을 느끼며 감사하는 하루가 될 것입니다.',love:'작은 관심이 큰 감동을 줍니다. 현재의 관계를 더욱 깊게 가꾸세요.',money:'수입과 지출이 균형을 이루는 시기입니다. 충동구매를 자제하세요.',health:'피로가 쌓이기 쉬운 날입니다. 충분한 수면과 스트레칭으로 몸을 달래주세요.',advice:'작은 씨앗이 큰 나무가 되듯, 오늘 하루의 작은 노력이 먼 훗날 울창한 숲이 된다.',stars:3,lucky_color:'베이지',lucky_number:'5',lucky_direction:'서쪽'}

  2:{

  },
  3:{

function renderStars(n){ return '★'.repeat(n)+'☆'.repeat(5-n); }

function setDateBadge(){
  const now=new Date();
  const days=['일','월','화','수','목','금','토'];
  document.getElementById('date-badge').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]}요일)`;
}

let drawnCards=[], flippedCount=0;

function getFortune(card){
  const mf=FORTUNES[card.month];
  if(!mf) return FORTUNES[1]['피'];
  return mf[card.type]||mf['피']||Object.values(mf)[0];
}

function drawCards(){
  const btn=document.getElementById('btn-draw');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>점괘를 읽는 중...';
  flippedCount=0;
  document.getElementById('result-panel').style.display='none';
  document.getElementById('result-panel').innerHTML='';
  const shuffled=[...HWATU].sort(()=>Math.random()-0.5);
  drawnCards=shuffled.slice(0,3);
  drawnCards.forEach((card,i)=>{
    const wrap=document.getElementById(`card-${i}`);
    wrap.classList.remove('flipped','type-광','type-띠','type-피');
    wrap.classList.add(`type-${card.type}`);
    const sym=card.type==='광'?card.symbol:(card.type==='띠'?'🎀':'🍃');
    wrap.querySelector('.card-front').innerHTML=`
      <span class="c-month">${card.month}월 · ${card.monthName}</span>
      <span class="c-emoji">${card.emoji}</span>
      <span class="c-symbol">${sym}</span>
      <span class="c-name">${card.flowerFull}</span>
      <span class="c-type">${card.type}</span>`;
    wrap.style.pointerEvents=i===0?'auto':'none';
  });
  setTimeout(()=>{
    btn.disabled=false;
    btn.innerHTML='🎴 패 뽑기';
    document.getElementById('main-instr').innerHTML='패가 준비되었습니다.<br><strong>왼쪽 패부터</strong> 차례로 클릭해서 뒤집어보세요!';
  },1200);
}

function flipCard(index){
  if(index!==flippedCount) return;
  const wrap=document.getElementById(`card-${index}`);
  wrap.classList.add('flipped');
  wrap.style.pointerEvents='none';
  flippedCount++;
  if(flippedCount<3){
    setTimeout(()=>{document.getElementById(`card-${flippedCount}`).style.pointerEvents='auto';},400);
  } else {
    setTimeout(showFortune,700);
  }
}

  panel.style.display='block';
  panel.innerHTML=`

    <div class="card-summaries">

      </div>
      <div class="fortune-block">
        <span class="fb-icon">💕</span><div class="fb-title">연애운</div>
        <div class="stars">${renderStars(lf.stars)}</div>
        <div class="fb-text">${lf.love}</div>
      </div>
      <div class="fortune-block">
        <span class="fb-icon">💰</span><div class="fb-title">재물운</div>
        <div class="stars">${renderStars(mf2.stars)}</div>
        <div class="fb-text">${mf2.money}</div>
      </div>
      <div class="fortune-block">
        <span class="fb-icon">🌿</span><div class="fb-title">건강운</div>
        <div class="stars">${renderStars(hf.stars)}</div>
        <div class="fb-text">${hf.health}</div>
      </div>
      <div class="fortune-block full">
        <span class="fb-icon">🔮</span><div class="fb-title">오늘의 흐름 (조언 + 전망)</div>
        <div class="fb-text">${f1.overall}<br><br>${f2.overall}</div>
      </div>
    </div>
    <div class="advice-box">
      <div class="ab-title">✦ 할머니의 한 말씀 ✦</div>
      <div class="ab-text">${f0.advice}</div>
    </div>
    <div class="lucky-row">
      <div class="lucky-item"><span class="li-label">행운의 색</span>${f2.lucky_color}</div>
      <div class="lucky-item"><span class="li-label">행운의 숫자</span>${f2.lucky_number}</div>
      <div class="lucky-item"><span class="li-label">행운의 방향</span>${f2.lucky_direction}</div>
    </div>
    <div class="action-row">
      <button class="btn btn-outline" onclick="copyFortune()">📋 운세 복사하기</button>
      <button class="btn btn-gold" onclick="resetGame()">🎴 다시 뽑기</button>
    </div>`;
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

function copyFortune(){
  const f0=getFortune(drawnCards[0]);
  const now=new Date();
  const text=[
    `🎴 화투 운세 — ${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`,
    ``,
    `현재: ${drawnCards[0].emoji} ${drawnCards[0].flowerFull} ${drawnCards[0].type}패`,
    `조언: ${drawnCards[1].emoji} ${drawnCards[1].flowerFull} ${drawnCards[1].type}패`,
    `전망: ${drawnCards[2].emoji} ${drawnCards[2].flowerFull} ${drawnCards[2].type}패`,
    ``,
    `✨ 할머니의 한 말씀`,
    f0.advice,
    ``,
    `💡 행운: ${getFortune(drawnCards[2]).lucky_color} | ${getFortune(drawnCards[2]).lucky_number} | ${getFortune(drawnCards[2]).lucky_direction}`,
  ].join('\n');
  navigator.clipboard.writeText(text).then(()=>{alert('운세가 클립보드에 복사되었습니다! 💫');}).catch(()=>{alert('복사에 실패했습니다.');});
}

function resetGame(){
  drawnCards=[]; flippedCount=0;
  document.getElementById('result-panel').style.display='none';
  document.getElementById('main-instr').innerHTML='마음을 가다듬고 눈을 잠시 감으세요.<br>준비가 되면 <strong>패 뽑기</strong> 버튼을 누르고,<br>세 장의 패를 하나씩 천천히 뒤집어보세요.';
  for(let i=0;i<3;i++){
    const w=document.getElementById(`card-${i}`);
    w.classList.remove('flipped','type-광','type-띠','type-피');
    w.style.pointerEvents='none';
    w.querySelector('.card-front').innerHTML='';
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

setDateBadge();
</script>
</body>
</html>
